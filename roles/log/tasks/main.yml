---
- name: Create directory for remote logs
  ansible.builtin.file:
    path: /var/log/rsyslog
    state: directory
    owner: syslog
    group: adm
    mode: "0755"

- name: Check AppArmor profile for rsyslog
  ansible.builtin.stat:
    path: /etc/apparmor.d/usr.sbin.rsyslogd
  register: aa_rsyslog

- name: Allow rsyslog to write /var/log/rsyslog (AppArmor)
  ansible.builtin.copy:
    dest: /etc/apparmor.d/local/usr.sbin.rsyslogd
    content: |
      /var/log/rsyslog/ rw,
      /var/log/rsyslog/** rw,
    mode: "0644"
  when: aa_rsyslog.stat.exists
  notify: reload apparmor rsyslog

- name: Configure rsyslog to receive remote logs
  ansible.builtin.template:
    src: 10-remote.conf.j2
    dest: /etc/rsyslog.d/10-remote.conf
    mode: "0644"
  notify: restart rsyslog

- name: Logrotate for remote logs
  ansible.builtin.copy:
    src: rsyslog-remote.logrotate
    dest: /etc/logrotate.d/rsyslog-remote
    mode: "0644"

- name: Validate rsyslog config
  ansible.builtin.command: rsyslogd -N1
  changed_when: false

- name: Ensure rsyslog started
  ansible.builtin.service:
    name: rsyslog
    state: started
    enabled: true

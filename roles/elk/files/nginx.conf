# Приём логов nginx (syslog по UDP) и отправка в Elasticsearch
input {
  udp {
    port => 5140
    type => "nginx"
  }
}

filter {
  grok {
    match => { "message" => "<%{POSINT:syslog_pri}>%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:syslog_host} %{DATA:syslog_tag}: %{GREEDYDATA:log_message}" }
  }
  if [syslog_tag] == "nginx_access" {
    grok {
      match => { "log_message" => "%{COMBINEDAPACHELOG}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "nginx-%{+YYYY.MM.dd}"
    data_stream => "false"
  }
}
